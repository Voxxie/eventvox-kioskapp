# WebKiosk configuratie - wordt bij elke start van de app gelezen van /sdcard/webkiosk.properties
# {serial} wordt vervangen door het serienummer van het toestel, {model} door het model, {version} door de app-versie
url=https://eventvox.nl/scanterminal?serial={serial}
# PIN voor het beheermenu
pin=1234
# LET OP: de repo is openbaar; zet in de config die je uitrolt een eigen PIN (niet committen)
# aantal keer snel op dezelfde plek tikken om het beheermenu te openen
menu_taps=10
# scherm altijd aan houden
keep_screen_on=false
# pagina elke X minuten herladen (0 = uit)
reload_minutes=0
# alleen voor interne servers met self-signed certificaat
ignore_ssl_errors=false

# --- NFC ---
# off | keyboard (typt in actief invoerveld) | event (JavaScript-event voor de website) | both
nfc_mode=both
# formaat van de tag-ID: hex | hex_reversed | hex_colon | dec | dec_reversed
nfc_uid_format=hex
# wat in keyboard-modus getypt wordt: uid | ndef (eerste tekst/URI op de tag, anders uid)
nfc_keyboard_value=uid
# Enter na het typen (verstuurt formulier, net als scanner)
nfc_send_enter=true
# zelfde tag binnen X ms negeren (voorkomt dubbel typen)
nfc_debounce_ms=1500
# reader mode elke X seconden opnieuw registreren als extra vangnet na slaapstand (0 = uit)
nfc_refresh_seconds=0

# --- Updates ---
# automatisch nieuwe versies installeren (stil als device owner; pas na 2 min zonder aanraking)
auto_update=true
# controleren gebeurt bij het starten van de app en handmatig (beheermenu > Updates);
# daarnaast elke X uur controleren (0 = niet)
update_check_hours=0
# adres van update.json; leeg = GitHub (nieuwste release van eventvox-kioskapp)
update_url=

# --- Wifi-profielen (alleen als device owner) ---
# Tot 20 netwerken: wifi.1 t/m wifi.20. security: WPA (WPA/WPA2-Personal, standaard), WEP of OPEN.
# Bestaande netwerken met dezelfde naam worden bijgewerkt; netwerken die de app eerder zette en hier
# niet meer staan, worden verwijderd. Het provision-script haalt dit bestand na 10 s weer van het toestel
# als er wachtwoorden in staan (de app bewaart de instellingen zelf).
#wifi.1.ssid=EventVOX-Ingang
#wifi.1.password=geheimwachtwoord
#wifi.1.security=WPA
#wifi.1.hidden=false
#wifi.1.priority=10
#wifi.2.ssid=Festival-Backup
#wifi.2.password=anderwachtwoord
# alle andere opgeslagen netwerken verwijderen (bv. thuis- of kantoornetwerken)
wifi_remove_others=false
# gebruikers kunnen de netwerken van de app niet wijzigen of vergeten
wifi_lockdown=false
