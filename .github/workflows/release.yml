name: Release APK

# Maakt bij elke gepubliceerde GitHub-release een ondertekende webkiosk.apk
# en hangt die aan de release. Tag-formaat: v0.0.1 (of 0.0.1).
# Handmatig starten (Actions > Release APK > Run workflow) maakt een test-build als artifact.
# Ook aangeroepen door "Release maken" (new-release.yml, workflow_call met tag en notes): een release die een workflow
# met GITHUB_TOKEN maakt, start deze workflow niet vanzelf, dus die roept hem zelf aan.

on:
  release:
    types: [published]
# Kanalen: stabiel = de nieuwste gewone release (releases/latest/download/update.json, GitHub slaat pre-releases
# daar over); test = de release "beta" (geen versie, pre-release), waar elke release, ook een pre-release, zijn
# update.json bij zet (releases/download/beta/update.json). Toestellen kiezen met update_channel=stable|beta.
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: De tag van de release (vX.Y.Z), al aangemaakt
        type: string
        required: true
      notes:
        description: De release-notes (voor update.json)
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # De rollende release "beta" zelf is geen versie
    if: github.event_name != 'release' || github.event.release.tag_name != 'beta'
    env:
      # De release: van het release-event, of van "Release maken" (workflow_call); leeg: een test-build
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      RELEASE_NOTES: ${{ inputs.notes || github.event.release.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Build-tools installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign android-sdk-platform-23 dalvik-exchange

      - name: Versie bepalen
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [ -n "$TAG" ]; then
            NAME="${TAG#v}"
            if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
              echo "::error::Tag '$TAG' heeft niet het formaat v0.0.1"; exit 1
            fi
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + ${BASH_REMATCH[4]:-0} ))
          else
            NAME="0.0.0-test.${GITHUB_RUN_NUMBER}"
            CODE=1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versie $NAME (code $CODE)"

      - name: Keystore uit secret halen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 ontbreekt. Zie README.md > Releases."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/webkiosk.keystore"

      - name: APK bouwen
        env:
          KEYSTORE: ${{ runner.temp }}/webkiosk.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'webkiosk' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          OUTPUT: ${{ github.workspace }}/dist/webkiosk.apk
          REQUIRE_KEYSTORE: 1
        run: |
          mkdir -p dist
          ./build.sh
          rm -f "$KEYSTORE"
          cp webkiosk.properties provision.sh provision.bat nfc-test.html README.md dist/
          (cd dist && zip -q "../webkiosk-${VERSION_NAME}.zip" * && sha256sum webkiosk.apk > webkiosk.apk.sha256)

      - name: update.json maken (voor automatische updates op de toestellen)
        if: env.RELEASE_TAG != ''
        env:
          TAG: ${{ env.RELEASE_TAG }}
          NOTES: ${{ env.RELEASE_NOTES }}
        run: |
          jq -n \
            --argjson code "${{ steps.version.outputs.code }}" \
            --arg name "${{ steps.version.outputs.name }}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/webkiosk.apk" \
            --arg sha "$(cut -d' ' -f1 dist/webkiosk.apk.sha256)" \
            --arg notes "$NOTES" \
            '{versionCode:$code, versionName:$name, url:$url, sha256:$sha, notes:$notes}' > dist/update.json
          cat dist/update.json

      - name: Aan release hangen
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          cp dist/webkiosk.apk "dist/webkiosk-${VERSION}.apk"
          gh release upload "$TAG" "dist/webkiosk-${VERSION}.apk" dist/webkiosk.apk dist/webkiosk.apk.sha256 \
            dist/update.json "webkiosk-${VERSION}.zip" --clobber

      - name: Test-build bewaren
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: webkiosk-${{ steps.version.outputs.name }}
          path: |
            dist/webkiosk.apk
            webkiosk-${{ steps.version.outputs.name }}.zip

      - name: Testkanaal bijwerken (release "beta")
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # De rollende pre-release "beta" (aanmaken als hij er nog niet is), alleen bijwerken als deze versie hoger is
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --target "$GITHUB_SHA" --title "Testkanaal" \
              --notes "Niet installeren: hier staat alleen update.json van de nieuwste release (ook pre-releases) voor toestellen op het testkanaal (update_channel=beta)."
          fi
          CURRENT=0
          if gh release download beta --pattern update.json --output current.json --clobber 2>/dev/null; then
            CURRENT=$(jq -r '.versionCode // 0' current.json)
          fi
          NEW=$(jq -r '.versionCode' dist/update.json)
          if [ "$NEW" -ge "$CURRENT" ]; then
            gh release upload beta dist/update.json --clobber
            echo "Testkanaal: versie $NEW (was $CURRENT)"
          else
            echo "Testkanaal blijft op $CURRENT (deze release is $NEW)"
          fi
