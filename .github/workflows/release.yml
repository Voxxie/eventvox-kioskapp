name: Release APK

# Maakt bij elke gepubliceerde GitHub-release een ondertekende webkiosk.apk
# en hangt die aan de release. Tag-formaat: v0.0.1 (of 0.0.1).
# Handmatig starten (Actions > Release APK > Run workflow) maakt een test-build als artifact.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build-tools installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner zipalign android-sdk-platform-23 dalvik-exchange

      - name: Versie bepalen
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            NAME="${TAG#v}"
            if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
              echo "::error::Tag '$TAG' heeft niet het formaat v0.0.1"; exit 1
            fi
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + ${BASH_REMATCH[4]:-0} ))
          else
            NAME="0.0.0-test.${GITHUB_RUN_NUMBER}"
            CODE=1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versie $NAME (code $CODE)"

      - name: Keystore uit secret halen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 ontbreekt. Zie README.md > Releases."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/webkiosk.keystore"

      - name: APK bouwen
        env:
          KEYSTORE: ${{ runner.temp }}/webkiosk.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'webkiosk' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          OUTPUT: ${{ github.workspace }}/dist/webkiosk.apk
          REQUIRE_KEYSTORE: 1
        run: |
          mkdir -p dist
          ./build.sh
          rm -f "$KEYSTORE"
          cp webkiosk.properties provision.sh provision.bat nfc-test.html README.md dist/
          (cd dist && zip -q "../webkiosk-${VERSION_NAME}.zip" * && sha256sum webkiosk.apk > webkiosk.apk.sha256)

      - name: update.json maken (voor automatische updates op de toestellen)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          jq -n \
            --argjson code "${{ steps.version.outputs.code }}" \
            --arg name "${{ steps.version.outputs.name }}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/webkiosk.apk" \
            --arg sha "$(cut -d' ' -f1 dist/webkiosk.apk.sha256)" \
            --arg notes "$NOTES" \
            '{versionCode:$code, versionName:$name, url:$url, sha256:$sha, notes:$notes}' > dist/update.json
          cat dist/update.json

      - name: Aan release hangen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          cp dist/webkiosk.apk "dist/webkiosk-${VERSION}.apk"
          gh release upload "$TAG" "dist/webkiosk-${VERSION}.apk" dist/webkiosk.apk dist/webkiosk.apk.sha256 \
            dist/update.json "webkiosk-${VERSION}.zip" --clobber

      - name: Test-build bewaren
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: webkiosk-${{ steps.version.outputs.name }}
          path: |
            dist/webkiosk.apk
            webkiosk-${{ steps.version.outputs.name }}.zip
